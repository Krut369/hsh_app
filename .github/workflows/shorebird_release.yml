# ───────────────────────────────────────────────────────────────
# 🐦 Shorebird Release & Patch — GitHub Actions
# ───────────────────────────────────────────────────────────────
# Triggers:
#   • Tag push (v*)            → creates a NEW Shorebird release
#   • Manual workflow_dispatch → creates a PATCH on existing release
#
# Required GitHub Secrets:
#   SHOREBIRD_TOKEN      – Shorebird CI token (from `shorebird login:ci`)
#
# Optional GitHub Secrets (for signed builds):
#   KEYSTORE_BASE64      – base64-encoded .jks / .keystore file
#   KEYSTORE_PASSWORD    – password for the keystore
#   KEY_ALIAS            – alias of the signing key
#   KEY_PASSWORD         – password for the key alias
# ───────────────────────────────────────────────────────────────

name: 🐦 Shorebird Release & Patch

on:
  push:
    branches: [MVP-1.0.0]
    tags:
      - 'v*'                   # e.g. v1.0.0, v1.2.3+4
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - release
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      release_version:
        description: 'Release version to patch (required for patch, e.g. 1.0.0+1)'
        required: false
        type: string

# Cancel in-progress runs when a new push arrives
concurrency:
  group: shorebird-${{ github.ref }}
  cancel-in-progress: true

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Shorebird Release (new baseline)
  # ═══════════════════════════════════════════════════════════
  shorebird-release:
    name: 🚀 Shorebird Release
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter SDK ─────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Shorebird CLI ───────────────────────────────────────
      - name: 🐦 Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # ── Dependencies ────────────────────────────────────────
      - name: 📦 Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 📥 Get Flutter dependencies
        run: flutter pub get

      # ── Code generation ─────────────────────────────────────
      - name: ⚙️ Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Signing (optional) ──────────────────────────────────
      - name: 🔑 Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
        continue-on-error: true

      - name: 📝 Create key.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
        continue-on-error: true

      # ── Shorebird Release ───────────────────────────────────
      - name: 🚀 Create Shorebird release (Android)
        if: >
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'android')
        run: shorebird release android --force

      - name: 🚀 Create Shorebird release (iOS)
        if: >
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.platform == 'ios'
        run: shorebird release ios --force

      # ── Summary ─────────────────────────────────────────────
      - name: 📊 Release Summary
        run: |
          echo "## 🚀 Shorebird Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | Release |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📱 Users will receive this as the new baseline on next app install." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — Shorebird Patch (OTA update)
  # ═══════════════════════════════════════════════════════════
  shorebird-patch:
    name: 🩹 Shorebird Patch (OTA)
    if: >
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.action == 'patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter SDK ─────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Shorebird CLI ───────────────────────────────────────
      - name: 🐦 Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # ── Dependencies ────────────────────────────────────────
      - name: 📦 Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 📥 Get Flutter dependencies
        run: flutter pub get

      # ── Code generation ─────────────────────────────────────
      - name: ⚙️ Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Signing (optional) ──────────────────────────────────
      - name: 🔑 Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
        continue-on-error: true

      - name: 📝 Create key.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
        continue-on-error: true

      # ── Shorebird Patch ─────────────────────────────────────
      - name: 🩹 Create Shorebird patch (Android)
        if: github.event.inputs.platform == 'android'
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            shorebird patch android --release-version=${{ github.event.inputs.release_version }} --force
          else
            shorebird patch android --force
          fi

      - name: 🩹 Create Shorebird patch (iOS)
        if: github.event.inputs.platform == 'ios'
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            shorebird patch ios --release-version=${{ github.event.inputs.release_version }} --force
          else
            shorebird patch ios --force
          fi

      # ── Summary ─────────────────────────────────────────────
      - name: 📊 Patch Summary
        run: |
          echo "## 🩹 Shorebird Patch Created (OTA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | Patch (OTA Update) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | ${{ github.event.inputs.platform }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Version** | ${{ github.event.inputs.release_version || 'latest' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📡 Existing users will receive this update automatically via OTA!" >> $GITHUB_STEP_SUMMARY
